<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>U-S-P | ログイン＆キャラ管理</title>
  <style>
    :root {
      --bg-1: #eef2ff;
      --bg-2: #e0f2fe;
      --bg-3: #fae8ff;
      --card-bg: rgba(255, 255, 255, 0.84);
      --card-border: rgba(255, 255, 255, 0.95);
      --text-main: #0f172a;
      --text-sub: #64748b;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --input-bg: rgba(255, 255, 255, 0.95);
      --border: #e2e8f0;
      --danger: #dc2626;
      --success: #059669;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 15% 20%, var(--bg-1), transparent 45%),
        radial-gradient(circle at 85% 15%, var(--bg-2), transparent 50%),
        radial-gradient(circle at 70% 85%, var(--bg-3), transparent 45%),
        #f8fafc;
    }

    .panel {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow:
        0 20px 45px -15px rgba(15, 23, 42, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
    }

    .brand {
      text-align: center;
      margin-bottom: 18px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .brand p {
      margin: 4px 0 0;
      font-size: 0.78rem;
      color: var(--text-sub);
    }

    .google-btn, .submit-btn, .secondary-btn {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.15s ease, background 0.15s ease;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-main);
    }

    .submit-btn {
      border: none;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
      box-shadow: 0 10px 20px -8px rgba(79, 70, 229, 0.55);
    }

    .secondary-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-main);
      margin-top: 8px;
    }

    .submit-btn:hover, .google-btn:hover, .secondary-btn:hover {
      filter: brightness(0.98);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0;
      color: var(--text-sub);
      font-size: 0.72rem;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(241, 245, 249, 0.9);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 14px;
    }

    .mode-tab {
      border: none;
      background: transparent;
      padding: 7px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
    }

    .mode-tab.active {
      background: #fff;
      color: var(--text-main);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
    }

    .field {
      margin-bottom: 10px;
    }

    .field label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 4px;
    }

    .field input, .field select, .field textarea {
      width: 100%;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      font-size: 0.85rem;
      color: var(--text-main);
      outline: none;
    }

    .field textarea {
      min-height: 68px;
      resize: vertical;
      font-family: inherit;
    }

    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .logged-in-box, .admin-box {
      display: none;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .user-chip {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--border);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mini-btn {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      flex-shrink: 0;
    }

    .parse-box {
      background: rgba(238, 242, 255, 0.7);
      border: 1px dashed #a5b4fc;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .parse-btn {
      margin-top: 6px;
      padding: 8px 12px;
      border: none;
      border-radius: 9px;
      background: #0f172a;
      color: #fff;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }

    .status-msg {
      margin-top: 12px;
      font-size: 0.78rem;
      line-height: 1.45;
      min-height: 1.2em;
      text-align: center;
    }

    .status-msg.error { color: var(--danger); }
    .status-msg.success { color: var(--success); }

    .guest-link {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 6px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 0.78rem;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand">
      <div class="brand-badge">USP</div>
      <h1>U-S-P マスタ＆アカウント管理</h1>
      <p>Firebase 連携（ログイン・Firestore キャラ登録）</p>
    </div>

    <!-- 未ログイン画面 -->
    <div id="authFormArea">
      <button type="button" class="google-btn" id="googleLoginBtn">Googleアカウントで続行</button>
      <div class="divider">またはメールアドレス</div>

      <div class="mode-tabs">
        <button type="button" class="mode-tab active" id="tabLogin">ログイン</button>
        <button type="button" class="mode-tab" id="tabSignup">新規登録</button>
      </div>

      <form id="emailAuthForm">

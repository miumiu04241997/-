<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>パッシブ計算</title>
  <style>
    :root {
      --bg-base: #0b1020;
      --bg-glow-1: rgba(99, 102, 241, 0.22);
      --bg-glow-2: rgba(14, 165, 233, 0.16);
      --surface: rgba(19, 27, 46, 0.9);
      --surface-elevated: rgba(28, 39, 66, 0.94);
      --surface-soft: rgba(15, 23, 42, 0.7);
      --border: rgba(148, 163, 184, 0.18);
      --border-strong: rgba(129, 140, 248, 0.45);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --accent-2: #38bdf8;
      --accent-grad: linear-gradient(135deg, #6366f1 0%, #38bdf8 100%);
      --danger: #fb7185;
      --success: #34d399;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      padding: 10px 8px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      color: var(--text-main);
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 12% 10%, var(--bg-glow-1), transparent 45%),
        radial-gradient(circle at 88% 14%, var(--bg-glow-2), transparent 45%);
      -webkit-tap-highlight-color: transparent;
    }

    .shell {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: var(--surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px 12px;
      box-shadow: 0 20px 50px -16px rgba(0, 0, 0, 0.65);
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .app-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .user-chip {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-sub);
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .mini-btn {
      padding: 5px 8px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      font-size: 0.66rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
    }

    .mini-btn:hover { border-color: var(--border-strong); }

    .auth-box {
      max-width: 390px;
      margin: 8px auto 0;
    }

    .google-btn, .submit-btn {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .google-btn {
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text-main);
    }

    .submit-btn {
      border: none;
      background: var(--accent-grad);
      color: #ffffff;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 0;
      color: var(--text-muted);
      font-size: 0.68rem;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface-soft);
      padding: 3px;
      border-radius: 11px;
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }

    .mode-tab {
      border: none;
      background: transparent;
      padding: 6px;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
    }

    .mode-tab.active {
      background: var(--surface-elevated);
      color: var(--text-main);
    }

    .field { margin-bottom: 9px; }

    .field label {
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 3px;
    }

    .field input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      font-size: 0.84rem;
      color: var(--text-main);
      outline: none;
    }

    .guest-link {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 6px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 0.74rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .action-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .action-btn {
      font-size: 0.7rem;
      padding: 7px 6px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text-main);
      font-weight: 700;
      cursor: pointer;
    }

    .btn-save { border-color: rgba(56, 189, 248, 0.35); color: #7dd3fc; }
    .btn-load { border-color: rgba(52, 211, 153, 0.35); color: #6ee7b7; }
    .btn-clear { border-color: rgba(251, 113, 133, 0.35); color: #fda4af; }

    .filter-box {
      background: var(--surface-soft);
      padding: 9px 8px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }

    .filter-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 8px;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--border);
    }

    .switch-btn-group {
      display: flex;
      background: var(--bg-base);
      padding: 2px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .switch-btn {
      font-size: 0.65rem;
      padding: 4px 9px;
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-sub);
      font-weight: 600;
    }

    .switch-btn.active {
      background: var(--accent-grad);
      color: #ffffff;
      font-weight: 700;
    }

    .reset-filter-btn {
      font-size: 0.64rem;
      padding: 4px 8px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text-sub);
      font-weight: 700;
      cursor: pointer;
    }

    .reset-filter-btn:hover { color: var(--text-main); }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1.25fr;
      gap: 6px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
    }

    .filter-group label {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 3px;
      text-align: center;
    }

    .filter-group select {
      font-size: 0.68rem;
      padding: 4px 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text-main);
      height: 28px;
      outline: none;
    }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-bottom: 10px;
    }

    .slot-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 7px 3px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      background: var(--surface-soft);
      min-height: 82px;
    }

    .slot-card.has-chara {
      border-color: rgba(129, 140, 248, 0.55);
      background: linear-gradient(180deg, rgba(99, 102, 241, 0.14) 0%, rgba(15, 23, 42, 0.78) 100%);
    }

    .slot-label {
      font-size: 0.58rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .slot-atk {
      font-size: 0.58rem;
      font-weight: 800;
      color: var(--accent-2);
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 5px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
    }

    .slot-select {
      width: 100%;
      font-size: 0.6rem;
      padding: 3px 2px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface-elevated);
      color: var(--text-main);
      text-align: center;
      outline: none;
    }

    .view-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-bottom: 8px;
      background: var(--surface-soft);
      padding: 3px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .view-tab {
      font-size: 0.68rem;
      padding: 6px 3px;
      text-align: center;
      background: transparent;
      border-radius: 9px;
      color: var(--text-sub);
      cursor: pointer;
      font-weight: 700;
    }

    .view-tab.active {
      background: var(--accent-grad);
      color: #ffffff;
    }

    .compare-header {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 11px;
      padding: 7px 9px;
      margin-bottom: 8px;
      display: none;
      align-items: center;
      justify-content: space-between;
      font-size: 0.7rem;
    }

    .compare-header select {
      font-size: 0.68rem;
      padding: 3px 6px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text-main);
    }

    .base-inputs-container {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      margin-bottom: 8px;
      display: none;
    }

    .base-input-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .base-input-row:last-child { margin-bottom: 0; }

    .base-row-label {
      width: 68px;
      font-size: 0.64rem;
      font-weight: 700;
      color: var(--text-sub);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .base-stat-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 3px;
      flex: 1;
    }

    .base-stat-input {
      width: 100%;
      font-size: 0.64rem;
      padding: 4px 2px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-elevated);
      color: var(--text-main);
    }

    .table-wrap {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface-soft);
    }

    table.result-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.68rem;
      text-align: center;
    }

    table.result-table th {
      background: rgba(99, 102, 241, 0.22);
      color: #e0e7ff;
      padding: 6px 2px;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
    }

    table.result-table td {
      padding: 6px 2px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }

    table.result-table tr:last-child td { border-bottom: none; }

    .chara-name-cell {
      max-width: 84px;
      padding-left: 4px !important;
      padding-right: 4px !important;
      font-size: 0.64rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      text-align: left !important;
    }

    .val-cell { color: #fef08a; font-weight: 800; }
    .diff-pos { color: #fb7185; font-size: 0.56rem; font-weight: 700; display: block; }
    .diff-neg { color: #38bdf8; font-size: 0.56rem; font-weight: 700; display: block; }
    .diff-eq { color: var(--text-muted); font-size: 0.56rem; display: block; }

    .empty-msg {
      text-align: center;
      color: var(--text-sub);
      padding: 16px 10px;
      font-size: 0.74rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-soft);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.75);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-content {
      background: var(--surface-elevated);
      border: 1px solid var(--border-strong);
      color: var(--text-main);
      padding: 16px 14px;
      border-radius: 18px;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }

    .modal-name { font-size: 0.96rem; font-weight: 800; margin: 0; }
    .modal-sub { font-size: 0.7rem; color: var(--text-sub); margin: 4px 0 10px; }

    .modal-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 0.74rem;
      text-align: left;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      padding: 9px 11px;
      border-radius: 11px;
      margin-bottom: 10px;
    }

    .modal-range {
      font-size: 0.7rem;
      color: var(--text-main);
      text-align: left;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 11px;
      margin-bottom: 12px;
      line-height: 1.45;
    }

    .modal-close-btn {
      background: var(--accent-grad);
      color: #ffffff;
      border: none;
      border-radius: 9px;
      padding: 7px 18px;
      font-size: 0.74rem;
      cursor: pointer;
      font-weight: 700;
    }

    .slot-item-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin: 10px 0;
      max-height: 250px;
      overflow-y: auto;
    }

    .slot-item-card {
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 8px 9px;
      background: var(--surface-soft);
      text-align: left;
    }

    .slot-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .slot-item-title { font-size: 0.74rem; font-weight: 700; color: var(--accent-2); }
    .slot-item-summary { font-size: 0.64rem; color: var(--text-sub); line-height: 1.35; }

    .modal-input {
      width: 100%;
      padding: 6px 8px;
      font-size: 0.76rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-base);
      color: var(--text-main);
      margin-top: 5px;
    }

    .status-msg {
      margin-top: 8px;
      font-size: 0.7rem;
      line-height: 1.35;
      min-height: 1.1em;
      text-align: center;
      color: var(--text-sub);
    }

    .status-msg.error { color: var(--danger); }
    .status-msg.success { color: var(--success); }

    .copyright-footer {
      font-size: 0.62rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="header-row">
      <h1 class="app-title">パッシブ計算</h1>
      <div class="top-actions">
        <span class="user-chip" id="userChip">ゲスト</span>
        <button type="button" class="mini-btn" id="reloadDataBtn">↻ 再読込</button>
        <button type="button" class="mini-btn" id="authActionBtn">ログイン</button>
      </div>
    </div>

    <div id="authSection" class="auth-box">
      <button type="button" class="google-btn" id="googleLoginBtn">Googleアカウントで続行</button>
      <div class="divider">またはメールアドレス</div>

      <div class="mode-tabs">
        <button type="button" class="mode-tab active" id="tabLogin">ログイン</button>
        <button type="button" class="mode-tab" id="tabSignup">新規登録</button>
      </div>

      <form id="emailAuthForm">
        <div class="field">
          <label for="emailInput">メールアドレス</label>
          <input id="emailInput" type="email" autocomplete="email" placeholder="name@example.com" required />
        </div>
        <div class="field">
          <label for="passwordInput">パスワード（6文字以上）</label>
          <input id="passwordInput" type="password" autocomplete="current-password" minlength="6" placeholder="••••••••" required />
        </div>
        <button type="submit" class="submit-btn" id="submitAuthBtn">ログイン</button>
      </form>

      <button type="button" class="guest-link" id="guestEnterBtn">ログインせずにゲストとして使う</button>
    </div>

    <div id="calcSection" style="display: none;">
      <div class="action-bar">
        <button type="button" class="action-btn btn-save" onclick="openSaveModal()">💾 PT保存</button>
        <button type="button" class="action-btn btn-load" onclick="openLoadModal()">📂 PT読込</button>
        <button type="button" class="action-btn btn-clear" onclick="clearParty()">🗑️ クリア</button>
      </div>

      <div class="filter-box">
        <div class="filter-top">
          <div class="switch-btn-group">
            <button type="button" id="modeCharaBtn" class="switch-btn active" onclick="setFilterMode('chara')">キャラ自身</button>
            <button type="button" id="modePassiveBtn" class="switch-btn" onclick="setFilterMode('passive')">パッシブ対象</button>
          </div>
          <button type="button" class="reset-filter-btn" onclick="resetFilters()">条件リセット</button>
        </div>

        <div class="filter-row">
          <div class="filter-group">
            <label>種族</label>
            <select id="tribeFilter" onchange="updateAllSelects()">
              <option value="すべて">すべて</option>
              <option value="神族">神族</option>
              <option value="魔神">魔神</option>
              <option value="魔族">魔族</option>
              <option value="異端">異端</option>
              <option value="聖人">聖人</option>
              <option value="飛天">飛天</option>
              <option value="魔獣">魔獣</option>
              <option value="聖獣">聖獣</option>
              <option value="精霊">精霊</option>
              <option value="鬼族">鬼族</option>
            </select>
          </div>
          <div class="filter-group">
            <label>属性</label>
            <select id="elementFilter" onchange="updateAllSelects()">
              <option value="すべて">すべて</option>
              <option value="闇属性">闇属性</option>
              <option value="無属性">無属性</option>
              <option value="光属性">光属性</option>
              <option value="風属性">風属性</option>
              <option value="火属性">火属性</option>
              <option value="水属性">水属性</option>
              <option value="雷属性">雷属性</option>
            </select>
          </div>
          <div class="filter-group">
            <label>並び替え</label>
            <select id="sortFilter" onchange="updateAllSelects()">
              <option value="default">標準 (登録順)</option>
              <option value="atk_desc">攻撃 (高い順)</option>
              <option value="hp_desc">HP (高い順)</option>
              <option value="spd_desc">素早さ (高い順)</option>
              <option value="sp_desc">SP (高い順)</option>
              <option value="crt_desc">Crt (高い順)</option>
              <option value="name_asc">名前 (五十音順)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="slot-grid" id="slotGrid"></div>

      <div class="view-tabs">
        <div id="tabPercent" class="view-tab active" onclick="setViewMode('percent')">補正率 (%)</div>
        <div id="tabCompare" class="view-tab" onclick="setViewMode('compare')">保存PT比較</div>
        <div id="tabStatCalc" class="view-tab" onclick="setViewMode('statCalc')">実数値計算</div>
      </div>

      <div id="compareHeaderArea" class="compare-header">
        <span>比較対象枠:</span>
        <select id="compareSlotSelect" onchange="recalculatePassives()"></select>
      </div>

      <div id="baseStatInputsArea" class="base-inputs-container">
        <div style="font-size:0.64rem; font-weight:700; color:var(--text-sub); margin-bottom:6px;">基礎ステータス（攻 / HP / 防 / 早 / SP / Crt）</div>
        <div id="statInputRows"></div>
      </div>

      <div id="tableContainer">
        <div class="empty-msg">データを読み込み中...</div>
      </div>
    </div>

    <div id="statusMsg" class="status-msg" aria-live="polite"></div>

    <div class="copyright-footer">
      当ツールは非公式であり、ゲーム内データの著作権は有限会社アイティルに帰属します
    </div>
  </main>

  <div id="detailModal" class="modal-overlay" onclick="closeModal('detailModal')">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 id="mName" class="modal-name">-</h3>
      <div id="mSub" class="modal-sub">[種族] / [属性]</div>
      <div class="modal-stats">
        <div>攻撃: <span id="mAtk">0%</span></div>
        <div>HP: <span id="mHp">0%</span></div>
        <div>防御: <span id="mDef">0%</span></div>
        <div>素早さ: <span id="mSpd">0%</span></div>
        <div>SP: <span id="mSp">0%</span></div>

    function initSlotGridDOM() {

    function setStatus(text, type = "") {
      statusMsg.textContent = text;
      statusMsg.className = `status-msg ${type}`.trim();

    function parseNum(val) {
      if (val === null || val === undefined) return 0;
      if (typeof val === "number") return Number.isNaN(val) ? 0 : val;
      const num = parseFloat(String(val).replace(/[^0-9.-]/g, ""));
      return Number.isNaN(num) ? 0 : num;
    }

    function isTribeMatch(t1, t2) {
      if (!t1 || !t2) return false;
      return String(t1).replace("族", "").trim() === String(t2).replace("族", "").trim();
    }

    function getMentionedTribes(rangeStr) {
      const range = String(rangeStr || "");
      const tribes = [];
      let checkText = range;

      if (checkText.includes("魔神")) {
        tribes.push("魔神");
        checkText = checkText.replace(/魔神/g, "");
      }

      const tribeList = [
        { name: "神族", keys: ["神族", "神"] },
        { name: "魔族", keys: ["魔族"] },
        { name: "魔獣", keys: ["魔獣"] },
        { name: "聖人", keys: ["聖人"] },
        { name: "聖獣", keys: ["聖獣"] },
        { name: "異端", keys: ["異端"] },
        { name: "飛天", keys: ["飛天"] },
        { name: "精霊", keys: ["精霊"] },
        { name: "鬼族", keys: ["鬼族", "鬼"] }
      ];

      tribeList.forEach((t) => {
        if (t.keys.some((k) => checkText.includes(k))) {
          tribes.push(t.name);
        }
      });

      return tribes;
    }

    async function loadCharactersFromFirestore() {
      setStatus("読み込み中...");
      try {
        const snap = await getDocs(collection(db, "characters"));
        const list = [];
        snap.forEach((docSnap) => {
          const d = docSnap.data();
          list.push({
            id: docSnap.id,
            name: d.name || "",
            tribe: d.tribe || "",
            element: d.element || "",
            range: d.range || "",
            atk: parseNum(d.atk),
            def: parseNum(d.def),
            spd: parseNum(d.spd),
            hp: parseNum(d.hp),
            sp: parseNum(d.sp),
            crt: parseNum(d.crt)
          });
        });

        list.sort((a, b) => (a.name || "").localeCompare(b.name || "", "ja"));
        masterData = list.map((item, idx) => ({ ...item, originalIdx: idx }));

        updateAllSelects();
        recalculatePassives();
        setStatus(`${masterData.length} 件読込完了`, "success");
      } catch (err) {
        console.error(err);
        document.getElementById("tableContainer").innerHTML =
          '<div class="empty-msg">データの読み込みに失敗しました</div>';
        setStatus(err.message || "読み込みエラー", "error");
      }
    }

    function showCalcView() {
      authSection.style.display = "none";
      calcSection.style.display = "block";

    window.resetFilters = function() {
      document.getElementById("tribeFilter").value = "すべて";
      document.getElementById("elementFilter").value = "すべて";
      document.getElementById("sortFilter").value = "default";
      updateAllSelects();
    };

      filterMode = mode;
      document.getElementById("modeCharaBtn").className = `switch-btn ${mode === "chara" ? "active" : ""}`;
      document.getElementById("modePassiveBtn").className = `switch-btn ${mode === "passive" ? "active" : ""}`;
      updateAllSelects();
    };

    window.setViewMode = function(mode) {
      currentView = mode;
      document.getElementById("tabPercent").className = `view-tab ${mode === "percent" ? "active" : ""}`;
      document.getElementById("tabCompare").className = `view-tab ${mode === "compare" ? "active" : ""}`;
      document.getElementById("tabStatCalc").className = `view-tab ${mode === "statCalc" ? "active" : ""}`;

      document.getElementById("compareHeaderArea").style.display = mode === "compare" ? "flex" : "none";
      document.getElementById("baseStatInputsArea").style.display = mode === "statCalc" ? "block" : "none";

      if (mode === "statCalc") renderStatInputRows();
      recalculatePassives();
    };

    function isApplicable(giver, receiver) {
      if (!giver || !receiver) return false;
      const range = String(giver.range || "");

      if (range.includes("全般") || range.includes("全体") || range.includes("すべての味方")) {
        return true;
      }

      const isSelfOnly =
        (range.includes("自身") || range.includes("自分")) &&
        !range.includes("味方") &&
        !range.includes("同属性") &&
        !range.includes("同種族") &&
        !range.includes("同じ");
      if (isSelfOnly) {
        return giver.originalIdx === receiver.originalIdx;
      }

      if (range.includes("同属性") || range.includes("同じ属性")) {
        const gElem = (giver.element || "").replace("属性", "");
        const rElem = (receiver.element || "").replace("属性", "");
        if (gElem && rElem && !rElem.includes(gElem) && !gElem.includes(rElem)) return false;
      }

      if (range.includes("同種族") || range.includes("同じ種族")) {
        if (!isTribeMatch(giver.tribe, receiver.tribe)) return false;
      }

      const targetTribes = getMentionedTribes(range);
      if (targetTribes.length > 0) {
        if (!targetTribes.some((tr) => isTribeMatch(tr, receiver.tribe))) return false;
      }

      const targetElems = [];
      ALL_ELEMS.forEach((el) => {
        if (range.includes(el)) {
          if (el === "無" && !range.includes("無属性") && !range.includes("無・") && !range.includes("・無")) return;
          targetElems.push(el);
        }
      });

      if (targetElems.length > 0) {
        const rElem = receiver.element || "";
        if (!targetElems.some((el) => rElem.includes(el))) return false;
      }

      return true;
    }

    function matchPassiveRange(item, selectedTribe, selectedElem) {
      const range = String(item.range || "");
      const selTribe = selectedTribe === "すべて" ? "" : selectedTribe;
      const selElem = selectedElem === "すべて" ? "" : selectedElem.replace("属性", "");

      if (!selTribe && !selElem) return true;
      const isGlobal = range.includes("全般") || range.includes("全体") || range.includes("すべての味方");

      let tribeOk = false;
      if (!selTribe) {
        tribeOk = true;
      } else if (isGlobal) {
        tribeOk = true;
      } else if (range.includes("同種族") || range.includes("同じ種族")) {
        tribeOk = isTribeMatch(item.tribe, selTribe);
      } else {
        const targetTribes = getMentionedTribes(range);
        tribeOk = targetTribes.length > 0 ? targetTribes.some((tr) => isTribeMatch(tr, selTribe)) : !!selElem;
      }

      let elemOk = false;
      if (!selElem) {
        elemOk = true;
      } else if (isGlobal) {
        elemOk = true;
      } else if (range.includes("同属性") || range.includes("同じ属性")) {
        const myElem = (item.element || "").replace("属性", "");
        elemOk = myElem.includes(selElem) || selElem.includes(myElem);
      } else {
        const targetElems = [];
        ALL_ELEMS.forEach((el) => {
          if (range.includes(el)) {
            if (el === "無" && !range.includes("無属性") && !range.includes("無・") && !range.includes("・無")) return;
            targetElems.push(el);
          }
        });
        elemOk = targetElems.length > 0 ? targetElems.includes(selElem) : !!selTribe;
      }

      return tribeOk && elemOk;
    }

    function matchCharaOwn(item, selectedTribe, selectedElem) {
      const matchTribe = selectedTribe === "すべて" || (item.tribe && item.tribe.includes(selectedTribe));
      const cleanElem = selectedElem.replace("属性", "");
      const matchElem = selectedElem === "すべて" || (item.element && item.element.includes(cleanElem));
      return matchTribe && matchElem;
    }

    function getFilteredList() {
      const tVal = document.getElementById("tribeFilter").value;
      const eVal = document.getElementById("elementFilter").value;
      const sVal = document.getElementById("sortFilter").value;

      const list = masterData.filter((item) =>
        filterMode === "chara" ? matchCharaOwn(item, tVal, eVal) : matchPassiveRange(item, tVal, eVal)
      );

      if (sVal === "atk_desc") list.sort((a, b) => b.atk - a.atk);
      else if (sVal === "hp_desc") list.sort((a, b) => b.hp - a.hp);
      else if (sVal === "spd_desc") list.sort((a, b) => b.spd - a.spd);
      else if (sVal === "sp_desc") list.sort((a, b) => b.sp - a.sp);
      else if (sVal === "crt_desc") list.sort((a, b) => b.crt - a.crt);
      else if (sVal === "name_asc") list.sort((a, b) => (a.name || "").localeCompare(b.name || "", "ja"));

      return list;
    }

    window.updateAllSelects = function() {
      const filtered = getFilteredList();
      for (let i = 0; i < 5; i++) {
        const sel = document.getElementById(`slotSelect_${i}`);
        if (!sel) continue;
        const currentVal = party[i];
        sel.innerHTML = `<option value="">--選択--</option>`;

        filtered.forEach((item) => {
          const opt = document.createElement("option");
          opt.value = item.originalIdx;
          const isCurrent = currentVal === item.originalIdx;
          const isUsedElsewhere = party.some((pIdx, sIdx) => sIdx !== i && pIdx === item.originalIdx);

          if (isUsedElsewhere) {
            opt.textContent = `${item.name} (選択中)`;
            opt.disabled = true;
          } else {
            opt.textContent = item.name;
          }
          if (isCurrent) opt.selected = true;
          sel.appendChild(opt);
        });
      }
    };

    window.onSlotChange = function(slotIdx) {
      const val = document.getElementById(`slotSelect_${slotIdx}`).value;
      party[slotIdx] = val === "" ? null : parseInt(val, 10);
      updateSlotCardUI(slotIdx);
      updateAllSelects();
      if (currentView === "statCalc") renderStatInputRows();
      recalculatePassives();
    };

    function updateSlotCardUI(slotIdx) {
      const charaIdx = party[slotIdx];
      const card = document.getElementById(`slotCard_${slotIdx}`);
      if (!card) return;
      if (charaIdx === null || !masterData[charaIdx]) {
        card.classList.remove("has-chara");
      } else {
        card.classList.add("has-chara");
      }
    }

    window.recalculatePassives = function() {
      const activeMembers = [];
      for (let i = 0; i < 5; i++) {
        if (party[i] !== null && masterData[party[i]]) {
          activeMembers.push({ slot: i, chara: masterData[party[i]] });
        }
      }

      for (let i = 0; i < 5; i++) {
        const el = document.getElementById(`slotAtk_${i}`);
        if (el) el.textContent = "ATK +0%";
      }

      if (activeMembers.length === 0) {
        document.getElementById("tableContainer").innerHTML = '<div class="empty-msg">スロットからキャラを選択してください</div>';
        return;
      }

      const results = activeMembers.map((mem) => {
        let atk = 0, hp = 0, def = 0, spd = 0, sp = 0, crt = 0;
        activeMembers.forEach((other) => {
          if (isApplicable(other.chara, mem.chara)) {
            atk += other.chara.atk;
            hp += other.chara.hp;
            def += other.chara.def;
            spd += other.chara.spd;
            sp += other.chara.sp;
            crt += other.chara.crt;
          }
        });
        document.getElementById(`slotAtk_${mem.slot}`).textContent = `ATK +${atk}%`;
        return { ...mem, stats: { atk, hp, def, spd, sp, crt } };
      });

      if (currentView === "percent") renderPercentTable(results);
      else if (currentView === "compare") renderCompareTable(results);
      else if (currentView === "statCalc") renderStatCalcTable(results);
    };

    function renderPercentTable(results) {
      let html = `
        <div class="table-wrap">
          <table class="result-table">
            <thead>
              <tr>
                <th style="text-align:left; padding-left:6px;">キャラ</th>
                <th>攻撃</th>
                <th>HP</th>
                <th>防御</th>
                <th>素早さ</th>
                <th>SP</th>
                <th>Crt</th>
              </tr>
            </thead>
            <tbody>
      `;
      results.forEach((res) => {
        html += `
          <tr>
            <td class="chara-name-cell" title="${res.chara.name}" onclick="openDetailModal(${res.slot})">${res.chara.name}</td>
            <td class="val-cell">+${res.stats.atk}%</td>
            <td class="val-cell">+${res.stats.hp}%</td>
            <td class="val-cell">+${res.stats.def}%</td>
            <td class="val-cell">+${res.stats.spd}%</td>
            <td class="val-cell">+${res.stats.sp}%</td>
            <td class="val-cell">+${res.stats.crt}%</td>
          </tr>
        `;
      });
      html += "</tbody></table></div>";
      document.getElementById("tableContainer").innerHTML = html;
    }

    function renderCompareTable(currentResults) {
      const targetSlotIdx = parseInt(document.getElementById("compareSlotSelect").value || "0", 10);
      const targetSlot = savedSlots[targetSlotIdx];

      if (!targetSlot || !targetSlot.party.some((p) => p !== null)) {
        document.getElementById("tableContainer").innerHTML =
          `<div class="empty-msg">「${targetSlot ? targetSlot.name : "選択枠"}」には保存データがありません</div>`;
        return;
      }

      const savedActive = [];
      targetSlot.party.forEach((cIdx, sIdx) => {
        if (cIdx !== null && masterData[cIdx]) {
          savedActive.push({ slot: sIdx, chara: masterData[cIdx] });
        }
      });

      const savedResults = savedActive.map((mem) => {
        let atk = 0, hp = 0, def = 0, spd = 0, sp = 0, crt = 0;
        savedActive.forEach((other) => {
          if (isApplicable(other.chara, mem.chara)) {
            atk += other.chara.atk;
            hp += other.chara.hp;
            def += other.chara.def;
            spd += other.chara.spd;
            sp += other.chara.sp;
            crt += other.chara.crt;
          }
        });
        return { ...mem, stats: { atk, hp, def, spd, sp, crt } };
      });

      let html = `
        <div class="table-wrap">
          <table class="result-table">
            <thead>
              <tr>
                <th style="text-align:left; padding-left:6px;">キャラ</th>
                <th>攻撃</th>
                <th>HP</th>
                <th>防御</th>
                <th>素早さ</th>
                <th>SP</th>
                <th>Crt</th>
              </tr>
            </thead>
            <tbody>
      `;

      currentResults.forEach((res) => {
        const savedMatch = savedResults.find((s) => s.slot === res.slot);
        const sStats = savedMatch ? savedMatch.stats : { atk: 0, hp: 0, def: 0, spd: 0, sp: 0, crt: 0 };

        function renderDiff(cur, sav) {
          const diff = cur - sav;
          let diffHtml = '<span class="diff-eq">±0%</span>';
          if (diff > 0) diffHtml = `<span class="diff-pos">▲+${diff}%</span>`;
          else if (diff < 0) diffHtml = `<span class="diff-neg">▼${diff}%</span>`;
          return `+${cur}% ${diffHtml}`;
        }

        html += `
          <tr>
            <td class="chara-name-cell" title="${res.chara.name}" onclick="openDetailModal(${res.slot})">${res.chara.name}</td>
            <td class="val-cell">${renderDiff(res.stats.atk, sStats.atk)}</td>
            <td class="val-cell">${renderDiff(res.stats.hp, sStats.hp)}</td>
            <td class="val-cell">${renderDiff(res.stats.def, sStats.def)}</td>
            <td class="val-cell">${renderDiff(res.stats.spd, sStats.spd)}</td>
            <td class="val-cell">${renderDiff(res.stats.sp, sStats.sp)}</td>
            <td class="val-cell">${renderDiff(res.stats.crt, sStats.crt)}</td>
          </tr>
        `;
      });

      html += "</tbody></table></div>";
      document.getElementById("tableContainer").innerHTML = html;
    }

    function renderStatInputRows() {
      const container = document.getElementById("statInputRows");
      container.innerHTML = "";
      for (let i = 0; i < 5; i++) {
        if (party[i] === null || !masterData[party[i]]) continue;
        const chara = masterData[party[i]];
        const row = document.createElement("div");
        row.className = "base-input-row";
        row.innerHTML = `
          <div class="base-row-label" title="${chara.name}">${chara.name}</div>
          <div class="base-stat-grid">
            <input type="number" class="base-stat-input" placeholder="攻" value="${baseStats[i].atk || ""}" oninput="updateBaseStat(${i}, 'atk', this.value)">
            <input type="number" class="base-stat-input" placeholder="HP" value="${baseStats[i].hp || ""}" oninput="updateBaseStat(${i}, 'hp', this.value)">
            <input type="number" class="base-stat-input" placeholder="防" value="${baseStats[i].def || ""}" oninput="updateBaseStat(${i}, 'def', this.value)">
            <input type="number" class="base-stat-input" placeholder="早" value="${baseStats[i].spd || ""}" oninput="updateBaseStat(${i}, 'spd', this.value)">
            <input type="number" class="base-stat-input" placeholder="SP" value="${baseStats[i].sp || ""}" oninput="updateBaseStat(${i}, 'sp', this.value)">
            <input type="number" class="base-stat-input" placeholder="Crt" value="${baseStats[i].crt || ""}" oninput="updateBaseStat(${i}, 'crt', this.value)">
          </div>
        `;
        container.appendChild(row);
      }
    }

    window.updateBaseStat = function(slotIdx, statKey, val) {
      baseStats[slotIdx][statKey] = Number(val) || 0;
      recalculatePassives();
    };

    function renderStatCalcTable(results) {
      let html = `
        <div class="table-wrap">
          <table class="result-table">
            <thead>
              <tr>
                <th style="text-align:left; padding-left:6px;">キャラ</th>
                <th>攻撃</th>
                <th>HP</th>
                <th>防御</th>
                <th>素早さ</th>
                <th>SP</th>
                <th>Crt</th>
              </tr>
            </thead>
            <tbody>
      `;
      results.forEach((res) => {
        const b = baseStats[res.slot];
        const calcFinal = (base, pct) => (!base ? "-" : Math.floor(base * (1 + pct / 100)).toLocaleString());
        html += `
          <tr>
            <td class="chara-name-cell" title="${res.chara.name}" onclick="openDetailModal(${res.slot})">${res.chara.name}</td>
            <td class="val-cell">${calcFinal(b.atk, res.stats.atk)}</td>
            <td class="val-cell">${calcFinal(b.hp, res.stats.hp)}</td>
            <td class="val-cell">${calcFinal(b.def, res.stats.def)}</td>
            <td class="val-cell">${calcFinal(b.spd, res.stats.spd)}</td>
            <td class="val-cell">${calcFinal(b.sp, res.stats.sp)}</td>
            <td class="val-cell">${calcFinal(b.crt, res.stats.crt)}</td>
          </tr>
        `;
      });
      html += "</tbody></table></div>";
      document.getElementById("tableContainer").innerHTML = html;
    }

    function getPartySummaryText(pArr) {
      const names = pArr
        .map((cIdx) => (cIdx !== null && masterData[cIdx] ? masterData[cIdx].name : null))
        .filter(Boolean);
      return names.length > 0 ? names.join(" / ") : "未設定";
    }

    window.openSaveModal = function() {
      if (!party.some((p) => p !== null)) return alert("保存するキャラが選択されていません");
      const container = document.getElementById("saveSlotList");
      container.innerHTML = "";
      savedSlots.forEach((slot, idx) => {
        const card = document.createElement("div");
        card.className = "slot-item-card";
        const checked = selectedSaveTargetSlot === idx ? "checked" : "";
        card.innerHTML = `
          <div class="slot-item-header">
            <label style="font-size:0.74rem; font-weight:700;">
              <input type="radio" name="saveTarget" value="${idx}" ${checked} onchange="setSaveTarget(${idx})"> 枠 ${idx + 1}
            </label>
          </div>
          <div class="slot-item-summary">${getPartySummaryText(slot.party)}</div>
          <input type="text" class="modal-input" id="slotNameInput_${idx}" value="${slot.name}" placeholder="パーティ名">
        `;
        container.appendChild(card);
      });
      document.getElementById("saveModal").style.display = "flex";
    };

    window.setSaveTarget = function(idx) {
      selectedSaveTargetSlot = idx;
    };

    window.executeSave = function() {
      const nameInput = document.getElementById(`slotNameInput_${selectedSaveTargetSlot}`).value.trim();
      const slotName = nameInput || `パーティ ${selectedSaveTargetSlot + 1}`;
      savedSlots[selectedSaveTargetSlot] = {
        id: selectedSaveTargetSlot,
        name: slotName,
        party: [...party],
        baseStats: JSON.parse(JSON.stringify(baseStats))
      };
      localStorage.setItem("passive_saved_slots_v1", JSON.stringify(savedSlots));
      updateCompareHeaderSelect();
      closeModal("saveModal");
      setStatus(`枠${selectedSaveTargetSlot + 1} [${slotName}] に保存しました`, "success");
    };

    window.openLoadModal = function() {
      const container = document.getElementById("loadSlotList");
      container.innerHTML = "";
      savedSlots.forEach((slot, idx) => {
        const card = document.createElement("div");
        card.className = "slot-item-card";
        const count = slot.party.filter((p) => p !== null).length;
        card.innerHTML = `
          <div class="slot-item-header">
            <div class="slot-item-title">${slot.name} (${count}/5体)</div>
            <button type="button" class="action-btn btn-load" style="padding:3px 9px;" ${count === 0 ? "disabled" : ""} onclick="loadSlot(${idx})">読込</button>
          </div>
          <div class="slot-item-summary">${getPartySummaryText(slot.party)}</div>
        `;
        container.appendChild(card);
      });
      document.getElementById("loadModal").style.display = "flex";
    };

    window.loadSlot = function(slotIdx) {
      const target = savedSlots[slotIdx];
      if (!target) return;
      party = [...target.party];
      if (target.baseStats) baseStats = JSON.parse(JSON.stringify(target.baseStats));
      for (let i = 0; i < 5; i++) updateSlotCardUI(i);
      updateAllSelects();
      if (currentView === "statCalc") renderStatInputRows();
      recalculatePassives();
      closeModal("loadModal");
      setStatus(`[${target.name}] を読み込みました`, "success");
    };

    function updateCompareHeaderSelect() {
      const sel = document.getElementById("compareSlotSelect");
      sel.innerHTML = "";
      savedSlots.forEach((slot, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        const count = slot.party.filter((p) => p !== null).length;
        opt.textContent = `枠${idx + 1}: ${slot.name} (${count}体)`;
        sel.appendChild(opt);
      });
    }

    window.clearParty = function() {
      party = [null, null, null, null, null];
      for (let i = 0; i < 5; i++) updateSlotCardUI(i);
      updateAllSelects();
      if (currentView === "statCalc") renderStatInputRows();
      recalculatePassives();
    };

    window.openDetailModal = function(slotIdx) {
      const charaIdx = party[slotIdx];
      if (charaIdx === null || !masterData[charaIdx]) return;
      const chara = masterData[charaIdx];
      document.getElementById("mName").textContent = chara.name;
      document.getElementById("mSub").textContent = `[${chara.tribe || "種族不明"}] / [${chara.element || "属性不明"}]`;
      document.getElementById("mAtk").textContent = `${chara.atk}%`;
      document.getElementById("mHp").textContent = `${chara.hp}%`;
      document.getElementById("mDef").textContent = `${chara.def}%`;
      document.getElementById("mSpd").textContent = `${chara.spd}%`;
      document.getElementById("mSp").textContent = `${chara.sp}%`;
      document.getElementById("mCrt").textContent = `${chara.crt}%`;
      document.getElementById("mRange").textContent = chara.range || "全般";
      document.getElementById("detailModal").style.display = "flex";
    };

    window.closeModal = function(modalId) {
      document.getElementById(modalId).style.display = "none";
    };

    tabLogin.addEventListener("click", () => {
      isSignupMode = false;
      tabLogin.classList.add("active");
      tabSignup.classList.remove("active");
      submitAuthBtn.textContent = "ログイン";
      passwordInput.setAttribute("autocomplete", "current-password");
      setStatus("");
    });

    tabSignup.addEventListener("click", () => {
      isSignupMode = true;
      tabSignup.classList.add("active");
      tabLogin.classList.remove("active");
      submitAuthBtn.textContent = "アカウント作成";
      passwordInput.setAttribute("autocomplete", "new-password");
      setStatus("");
    });

    document.getElementById("googleLoginBtn").addEventListener("click", async () => {
      setStatus("Googleログインを確認中...");
      try {
        isGuestMode = false;
        await signInWithPopup(auth, googleProvider);
      } catch (err) {
        setStatus(err.message || "Googleログインに失敗しました", "error");
      }
    });

    document.getElementById("emailAuthForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("emailInput").value.trim();
      const password = passwordInput.value;
      setStatus(isSignupMode ? "作成中..." : "ログイン中...");
      try {
        isGuestMode = false;
        if (isSignupMode) {
          await createUserWithEmailAndPassword(auth, email, password);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (err) {
        setStatus(err.message || "認証に失敗しました", "error");
      }
    });

    document.getElementById("guestEnterBtn").addEventListener("click", () => {
      isGuestMode = true;
      userChip.textContent = "ゲスト";
      authActionBtn.textContent = "ログイン";
      showCalcView();
      if (masterData.length === 0) loadCharactersFromFirestore();
    });

    authActionBtn.addEventListener("click", async () => {
      if (currentUser) {
        await signOut(auth);
      } else {
        showAuthView();
      }
    });

    document.getElementById("reloadDataBtn").addEventListener("click", () => {
      loadCharactersFromFirestore();
    });

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        isGuestMode = false;
        userChip.textContent = user.email || user.displayName || "ログイン中";
        authActionBtn.textContent = "ログアウト";
        showCalcView();
        loadCharactersFromFirestore();
      } else if (!isGuestMode) {
        userChip.textContent = "ゲスト";
        authActionBtn.textContent = "ログイン";
        showAuthView();
      }
    });

    const localSlots = localStorage.getItem("passive_saved_slots_v1") || localStorage.getItem("usp_saved_slots_v1");
    if (localSlots) {
      try { savedSlots = JSON.parse(localSlots); } catch (e) {}
    }

    initSlotGridDOM();
    updateCompareHeaderSelect();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>U-S-P | ログイン</title>
  <style>
    :root {
      --bg-1: #eef2ff;
      --bg-2: #e0f2fe;
      --bg-3: #fae8ff;
      --card-bg: rgba(255, 255, 255, 0.78);
      --card-border: rgba(255, 255, 255, 0.9);
      --text-main: #0f172a;
      --text-sub: #64748b;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --input-bg: rgba(255, 255, 255, 0.9);
      --border: #e2e8f0;
      --danger: #dc2626;
      --success: #059669;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 15% 20%, var(--bg-1), transparent 45%),
        radial-gradient(circle at 85% 15%, var(--bg-2), transparent 50%),
        radial-gradient(circle at 70% 85%, var(--bg-3), transparent 45%),
        #f8fafc;
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow:
        0 20px 45px -15px rgba(15, 23, 42, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: #fff;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      box-shadow: 0 10px 20px -6px rgba(79, 70, 229, 0.45);
      margin-bottom: 10px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand p {
      margin: 4px 0 0;
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    .google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 11px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.15s ease, background 0.15s ease;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    }

    .google-btn:hover {
      background: #f8fafc;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
    }

    .google-btn:active {
      transform: scale(0.99);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: var(--text-sub);
      font-size: 0.75rem;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(241, 245, 249, 0.9);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .mode-tab {
      border: none;
      background: transparent;
      padding: 8px;
      border-radius: 9px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-tab.active {
      background: #fff;
      color: var(--text-main);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 0.76rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      font-size: 0.9rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
    }

    .submit-btn {
      width: 100%;
      margin-top: 4px;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px -8px rgba(79, 70, 229, 0.6);
      transition: transform 0.12s ease, filter 0.15s ease;
    }

    .submit-btn:hover {
      filter: brightness(1.04);
    }

    .submit-btn:active {
      transform: scale(0.99);
    }

    .guest-link {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .guest-link:hover {
      color: var(--text-main);
    }

    .status-msg {
      margin-top: 12px;
      font-size: 0.78rem;
      line-height: 1.45;
      min-height: 1.2em;
      text-align: center;
    }

    .status-msg.error { color: var(--danger); }
    .status-msg.success { color: var(--success); }

    .logged-in-box {
      display: none;
      text-align: center;
      padding: 8px 0;
    }

    .user-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .logout-btn {
      padding: 9px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-sub);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="auth-card">
    <div class="brand">
      <div class="brand-badge">USP</div>
      <h1>おかえりなさい</h1>
      <p>パーティ・スキル・周回データをクラウド管理</p>
    </div>

    <div id="authFormArea">
      <button type="button" class="google-btn" id="googleLoginBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.5-1.14 2.77-2.4 3.62v3.01h3.88c2.27-2.09 3.54-5.17 3.54-8.48z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.01c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.26v3.1C3.23 21.3 7.31 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.28c-.24-.72-.38-1.49-.38-2.28s.14-1.56.38-2.28V6.62H1.26A11.97 11.97 0 0 0 0 12c0 1.93.46 3.76 1.26 5.38l4.02-3.1z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.23 2.7 1.26 6.62l4.02 3.1c.95-2.85 3.6-4.96 6.72-4.96z"/>
        </svg>
        Googleアカウントで続行
      </button>

      <div class="divider">またはメールアドレス</div>

      <div class="mode-tabs" role="tablist">
        <button type="button" class="mode-tab active" id="tabLogin" role="tab" aria-selected="true">ログイン</button>
        <button type="button" class="mode-tab" id="tabSignup" role="tab" aria-selected="false">新規登録</button>
      </div>

      <form id="emailAuthForm">
        <div class="field">
          <label for="emailInput">メールアドレス</label>
          <input id="emailInput" type="email" autocomplete="email" placeholder="name@example.com" required />
        </div>
        <div class="field">
          <label for="passwordInput">パスワード（6文字以上）</label>
          <input id="passwordInput" type="password" autocomplete="current-password" minlength="6" placeholder="••••••••" required />
        </div>
        <button type="submit" class="submit-btn" id="submitAuthBtn">ログイン</button>
      </form>

      <button type="button" class="guest-link" id="guestEnterBtn">ログインせずにゲストとして使う</button>
    </div>

    <div id="loggedInArea" class="logged-in-box">
      <div class="user-chip" id="userChip">ログイン中</div>
      <button type="button" class="submit-btn" id="goAppBtn">ツールを開く</button>
      <div style="margin-top: 10px;">
        <button type="button" class="logout-btn" id="logoutBtn">ログアウト</button>
      </div>
    </div>

    <div id="statusMsg" class="status-msg" aria-live="polite"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDZPgxYcZCunh-6HYaUiOfycr6mPTJBxH8",
      authDomain: "u-s-p-55871.firebaseapp.com",
      projectId: "u-s-p-55871",
      storageBucket: "u-s-p-55871.firebasestorage.app",
      messagingSenderId: "300966590941",
      appId: "1:300966590941:web:a6e5eade16fd57dd7d1e34",
      measurementId: "G-HCDVT2J5J3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    let isSignupMode = false;

    const authFormArea = document.getElementById("authFormArea");
    const loggedInArea = document.getElementById("loggedInArea");
    const userChip = document.getElementById("userChip");
    const statusMsg = document.getElementById("statusMsg");
    const tabLogin = document.getElementById("tabLogin");
    const tabSignup = document.getElementById("tabSignup");
    const submitAuthBtn = document.getElementById("submitAuthBtn");
    const passwordInput = document.getElementById("passwordInput");

    function setStatus(text, type = "") {
      statusMsg.textContent = text;
      statusMsg.className = `status-msg ${type}`.trim();
    }

    tabLogin.addEventListener("click", () => {
      isSignupMode = false;
      tabLogin.classList.add("active");
      tabSignup.classList.remove("active");
      tabLogin.setAttribute("aria-selected", "true");
      tabSignup.setAttribute("aria-selected", "false");
      submitAuthBtn.textContent = "ログイン";
      passwordInput.setAttribute("autocomplete", "current-password");
      setStatus("");
    });

    tabSignup.addEventListener("click", () => {
      isSignupMode = true;
      tabSignup.classList.add("active");
      tabLogin.classList.remove("active");
      tabSignup.setAttribute("aria-selected", "true");
      tabLogin.setAttribute("aria-selected", "false");
      submitAuthBtn.textContent = "アカウント作成";
      passwordInput.setAttribute("autocomplete", "new-password");
      setStatus("");
    });

    document.getElementById("googleLoginBtn").addEventListener("click", async () => {
      setStatus("Googleログインを確認中...");
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (err) {
        setStatus(err.message || "Googleログインに失敗しました。", "error");
      }
    });

    document.getElementById("emailAuthForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("emailInput").value.trim();
      const password = passwordInput.value;

      setStatus(isSignupMode ? "アカウントを作成中..." : "ログイン中...");
      try {
        if (isSignupMode) {
          await createUserWithEmailAndPassword(auth, email, password);
          setStatus("アカウントを作成しました！", "success");
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (err) {
        setStatus(err.message || "認証に失敗しました。", "error");
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      setStatus("ログアウトしました。");
    });

    document.getElementById("guestEnterBtn").addEventListener("click", () => {
      setStatus("ゲストモードで開始します（ログインなしでも利用可能）。", "success");
    });

    document.getElementById("goAppBtn").addEventListener("click", () => {
      setStatus("メイン画面へ遷移する準備ができています。", "success");
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        authFormArea.style.display = "none";
        loggedInArea.style.display = "block";
        userChip.textContent = user.email || user.displayName || "ログイン中";
        setStatus("サインイン済みです。", "success");
      } else {
        authFormArea.style.display = "block";
        loggedInArea.style.display = "none";
      }
    });
  </script>
</body>
</html>

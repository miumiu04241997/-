<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>U-S-P | ログイン＆キャラ管理</title>
  <style>
    :root {
      --bg-1: #eef2ff;
      --bg-2: #e0f2fe;
      --bg-3: #fae8ff;
      --card-bg: rgba(255, 255, 255, 0.84);
      --card-border: rgba(255, 255, 255, 0.95);
      --text-main: #0f172a;
      --text-sub: #64748b;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --input-bg: rgba(255, 255, 255, 0.95);
      --border: #e2e8f0;
      --danger: #dc2626;
      --success: #059669;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 15% 20%, var(--bg-1), transparent 45%),
        radial-gradient(circle at 85% 15%, var(--bg-2), transparent 50%),
        radial-gradient(circle at 70% 85%, var(--bg-3), transparent 45%),
        #f8fafc;
    }

    .panel {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow:
        0 20px 45px -15px rgba(15, 23, 42, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
    }

    .brand {
      text-align: center;
      margin-bottom: 18px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .brand p {
      margin: 4px 0 0;
      font-size: 0.78rem;
      color: var(--text-sub);
    }

    .google-btn, .submit-btn, .secondary-btn {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.15s ease, background 0.15s ease;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-main);
    }

    .submit-btn {
      border: none;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
      box-shadow: 0 10px 20px -8px rgba(79, 70, 229, 0.55);
    }

    .secondary-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-main);
      margin-top: 8px;
    }

    .submit-btn:hover, .google-btn:hover, .secondary-btn:hover {
      filter: brightness(0.98);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0;
      color: var(--text-sub);
      font-size: 0.72rem;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(241, 245, 249, 0.9);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 14px;
    }

    .mode-tab {
      border: none;
      background: transparent;
      padding: 7px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
    }

    .mode-tab.active {
      background: #fff;
      color: var(--text-main);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
    }

    .field {
      margin-bottom: 10px;
    }

    .field label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 4px;
    }

    .field input, .field select, .field textarea {
      width: 100%;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      font-size: 0.85rem;
      color: var(--text-main);
      outline: none;
    }

    .field textarea {
      min-height: 68px;
      resize: vertical;
      font-family: inherit;
    }

    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .logged-in-box, .admin-box {
      display: none;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .user-chip {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--border);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mini-btn {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      flex-shrink: 0;
    }

    .parse-box {
      background: rgba(238, 242, 255, 0.7);
      border: 1px dashed #a5b4fc;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .import-box {
      background: rgba(236, 253, 245, 0.75);
      border: 1px dashed #6ee7b7;
      border-radius: 14px;
      padding: 12px;
      margin-top: 16px;
    }

    .parse-btn {
      margin-top: 6px;
      padding: 8px 12px;
      border: none;
      border-radius: 9px;
      background: #0f172a;
      color: #fff;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }

    .import-btn {
      margin-top: 6px;
      padding: 8px 12px;
      border: none;
      border-radius: 9px;
      background: #059669;
      color: #fff;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }

    .status-msg {
      margin-top: 12px;
      font-size: 0.78rem;
      line-height: 1.45;
      min-height: 1.2em;
      text-align: center;
    }

    .status-msg.error { color: var(--danger); }
    .status-msg.success { color: var(--success); }

    .guest-link {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 6px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 0.78rem;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand">
      <div class="brand-badge">USP</div>
      <h1>U-S-P マスタ＆アカウント管理</h1>
      <p>Firebase 連携（ログイン・Firestore キャラ登録）</p>
    </div>

    <!-- 未ログイン画面 -->
    <div id="authFormArea">
      <button type="button" class="google-btn" id="googleLoginBtn">Googleアカウントで続行</button>
      <div class="divider">またはメールアドレス</div>

      <div class="mode-tabs">
        <button type="button" class="mode-tab active" id="tabLogin">ログイン</button>
        <button type="button" class="mode-tab" id="tabSignup">新規登録</button>
      </div>

      <form id="emailAuthForm">
        <div class="field">
          <label for="emailInput">メールアドレス</label>
          <input id="emailInput" type="email" autocomplete="email" placeholder="name@example.com" required />
        </div>
        <div class="field">
          <label for="passwordInput">パスワード（6文字以上）</label>
          <input id="passwordInput" type="password" autocomplete="current-password" minlength="6" placeholder="••••••••" required />
        </div>
        <button type="submit" class="submit-btn" id="submitAuthBtn">ログイン</button>
      </form>

      <button type="button" class="guest-link" id="guestEnterBtn">ログインせずにゲストとして使う</button>
    </div>

    <!-- ログイン後メニュー -->
    <div id="loggedInArea" class="logged-in-box">
      <div class="top-bar">
        <div class="user-chip" id="userChip">ログイン中</div>
        <button type="button" class="mini-btn" id="logoutBtn">ログアウト</button>
      </div>

      <button type="button" class="submit-btn" id="openAdminBtn">🛠️ キャラを追加・一括移行（Firestore）</button>
      <button type="button" class="secondary-btn" id="goToolBtn">計算ツールへ進む</button>
    </div>

    <!-- 管理者：キャラ追加＆一括インポート -->
    <div id="adminArea" class="admin-box">
      <div class="top-bar">
        <div class="user-chip" id="adminChip">キャラ管理</div>
        <button type="button" class="mini-btn" id="backToMenuBtn">← 戻る</button>
      </div>

      <div class="parse-box">
        <div class="field" style="margin-bottom: 4px;">
          <label for="wikiRawInput">Wikiのパッシブ文・数値を貼り付けて自動入力</label>
          <textarea id="wikiRawInput" placeholder="例: 同じパーティに編成されている神族・飛天の下記の値がUP 攻撃+5% HP+25% 防御+10% SP+25%"></textarea>
        </div>
        <button type="button" class="parse-btn" id="parseWikiBtn">✨ テキストから自動入力</button>
      </div>

      <form id="addCharaForm">
        <div class="field">
          <label for="cName">名前（スプシA列）</label>
          <input id="cName" type="text" required placeholder="例: アストラルヴィシュヌ" />
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="cTribe">種族（スプシB列）</label>
            <input id="cTribe" type="text" required placeholder="例: 神族" />
          </div>
          <div class="field">
            <label for="cElement">属性（スプシC列）</label>
            <input id="cElement" type="text" required placeholder="例: 闇属性" />
          </div>
        </div>

        <div class="field">
          <label for="cRange">パッシブ範囲（スプシD列）</label>
          <input id="cRange" type="text" required placeholder="例: 同じパーティに編成されている神族の下記の値がUP" />
        </div>

        <div class="grid-3">
          <div class="field">
            <label for="cAtk">攻撃 %（E列）</label>
            <input id="cAtk" type="number" value="0" required />
          </div>
          <div class="field">
            <label for="cDef">防御 %（F列）</label>
            <input id="cDef" type="number" value="0" required />
          </div>
          <div class="field">
            <label for="cSpd">素早 %（G列）</label>
            <input id="cSpd" type="number" value="0" required />
          </div>
          <div class="field">
            <label for="cHp">HP %（H列）</label>
            <input id="cHp" type="number" value="0" required />
          </div>
          <div class="field">
            <label for="cSp">SP %（I列）</label>
            <input id="cSp" type="number" value="0" required />
          </div>
          <div class="field">
            <label for="cCrt">Crt %（J列）</label>
            <input id="cCrt" type="number" value="0" required />
          </div>
        </div>

        <div class="field">
          <label for="cIcon">キャラアイコンURL（スプシK列）</label>
          <input id="cIcon" type="url" placeholder="https://..." />
        </div>

        <button type="submit" class="submit-btn" id="saveCharaBtn">Firestore に保存する</button>
      </form>

      <!-- スプシ（TSV / CSV）一括移行ボックス -->
      <div class="import-box">
        <div class="field" style="margin-bottom: 4px;">
          <label for="sheetBulkInput">📥 スプシから一括移行（A列〜K列をそのままコピペ）</label>
          <textarea id="sheetBulkInput" placeholder="スプレッドシートのA〜K列を選択してコピーし、ここにそのまま貼り付けてください（見出し行は自動でスキップされます）。"></textarea>
        </div>
        <button type="button" class="import-btn" id="bulkImportBtn">📥 一括インポート実行</button>
      </div>
    </div>

    <div id="statusMsg" class="status-msg" aria-live="polite"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      writeBatch,
      doc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDZPgxYcZCunh-6HYaUiOfycr6mPTJBxH8",
      authDomain: "u-s-p-55871.firebaseapp.com",
      projectId: "u-s-p-55871",
      storageBucket: "u-s-p-55871.firebasestorage.app",
      messagingSenderId: "300966590941",
      appId: "1:300966590941:web:a6e5eade16fd57dd7d1e34",
      measurementId: "G-HCDVT2J5J3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    const ADMIN_EMAILS = ["miumiu04241997@nojobunoraifu.com"];

    let isSignupMode = false;
    let currentUser = null;

    const authFormArea = document.getElementById("authFormArea");
    const loggedInArea = document.getElementById("loggedInArea");
    const adminArea = document.getElementById("adminArea");
    const userChip = document.getElementById("userChip");
    const statusMsg = document.getElementById("statusMsg");
    const tabLogin = document.getElementById("tabLogin");
    const tabSignup = document.getElementById("tabSignup");
    const submitAuthBtn = document.getElementById("submitAuthBtn");
    const passwordInput = document.getElementById("passwordInput");

    function setStatus(text, type = "") {
      statusMsg.textContent = text;
      statusMsg.className = `status-msg ${type}`.trim();
    }

    function isAdminUser(user) {
      if (!user || !user.email) return false;
      return ADMIN_EMAILS.includes(user.email.toLowerCase());
    }

    function cleanCell(val) {
      return String(val || "").replace(/^"|"$/g, "").replace(/\r?\n/g, " ").replace(/\s+/g, " ").trim();
    }

    function toNum(val) {
      const n = parseFloat(String(val || "0").replace(/[^0-9.-]/g, ""));
      return Number.isNaN(n) ? 0 : n;
    }

    // スプレッドシートのコピー（タブ区切り・改行を含むセル対応）をパース
    function parseSheetRows(rawText) {
      const rows = [];
      let currentRow = [];
      let currentCell = "";
      let inQuotes = false;

      for (let i = 0; i < rawText.length; i++) {
        const ch = rawText[i];
        const next = rawText[i + 1];

        if (ch === '"') {
          if (inQuotes && next === '"') {
            currentCell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === "\t" && !inQuotes) {
          currentRow.push(currentCell);
          currentCell = "";
        } else if ((ch === "\n" || (ch === "\r" && next === "\n")) && !inQuotes) {
          if (ch === "\r") i++;
          currentRow.push(currentCell);
          rows.push(currentRow);
          currentRow = [];
          currentCell = "";
        } else if (ch === "\r" && !inQuotes) {
          currentRow.push(currentCell);
          rows.push(currentRow);
          currentRow = [];
          currentCell = "";
        } else {
          currentCell += ch;
        }
      }
      if (currentCell.length > 0 || currentRow.length > 0) {
        currentRow.push(currentCell);
        rows.push(currentRow);
      }

      return rows
        .map((cols) => {
          const name = cleanCell(cols[0]);
          if (!name || name === "名前") return null;
          return {
            name,
            tribe: cleanCell(cols[1]),
            element: cleanCell(cols[2]),
            range: cleanCell(cols[3]),
            atk: toNum(cols[4]),
            def: toNum(cols[5]),
            spd: toNum(cols[6]),
            hp: toNum(cols[7]),
            sp: toNum(cols[8]),
            crt: toNum(cols[9]),
            icon: cleanCell(cols[10]),
            updatedAt: serverTimestamp()
          };
        })
        .filter(Boolean);
    }

    tabLogin.addEventListener("click", () => {
      isSignupMode = false;
      tabLogin.classList.add("active");
      tabSignup.classList.remove("active");
      submitAuthBtn.textContent = "ログイン";
      passwordInput.setAttribute("autocomplete", "current-password");
      setStatus("");
    });

    tabSignup.addEventListener("click", () => {
      isSignupMode = true;
      tabSignup.classList.add("active");
      tabLogin.classList.remove("active");
      submitAuthBtn.textContent = "アカウント作成";
      passwordInput.setAttribute("autocomplete", "new-password");
      setStatus("");
    });

    document.getElementById("googleLoginBtn").addEventListener("click", async () => {
      setStatus("Googleログインを確認中...");
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (err) {
        setStatus(err.message || "Googleログインに失敗しました。", "error");
      }
    });

    document.getElementById("emailAuthForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("emailInput").value.trim();
      const password = passwordInput.value;
      setStatus(isSignupMode ? "アカウントを作成中..." : "ログイン中...");
      try {
        if (isSignupMode) {
          await createUserWithEmailAndPassword(auth, email, password);
          setStatus("アカウントを作成しました！", "success");
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (err) {
        setStatus(err.message || "認証に失敗しました。", "error");
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      adminArea.style.display = "none";
      setStatus("ログアウトしました。");
    });

    document.getElementById("openAdminBtn").addEventListener("click", () => {
      if (!currentUser) return setStatus("ログインが必要です。", "error");
      if (!isAdminUser(currentUser)) {
        return setStatus("このアカウントにはキャラ追加権限がありません。", "error");
      }
      loggedInArea.style.display = "none";
      adminArea.style.display = "block";
      setStatus("1件追加またはスプシからの一括移行ができます。");
    });

    document.getElementById("backToMenuBtn").addEventListener("click", () => {
      adminArea.style.display = "none";
      loggedInArea.style.display = "block";
      setStatus("");
    });

    document.getElementById("guestEnterBtn").addEventListener("click", () => {
      setStatus("ゲストモードで開始します。", "success");
    });

    document.getElementById("goToolBtn").addEventListener("click", () => {
      setStatus("メインツール画面の統合準備ができました。", "success");
    });

    document.getElementById("parseWikiBtn").addEventListener("click", () => {
      const raw = document.getElementById("wikiRawInput").value || "";
      if (!raw.trim()) return setStatus("解析するテキストを貼り付けてください。", "error");

      const extractStat = (labels) => {
        for (const label of labels) {
          const re = new RegExp(`${label}\\s*[+＋]?\\s*(\\d+)\\s*%?`, "i");
          const m = raw.match(re);
          if (m) return Number(m[1]);
        }
        return null;
      };

      const atk = extractStat(["攻撃", "ATK"]);
      const def = extractStat(["防御", "DEF"]);
      const spd = extractStat(["素早さ", "素早", "SPD"]);
      const hp = extractStat(["HP"]);
      const sp = extractStat(["SP"]);
      const crt = extractStat(["Crt", "CRT", "クリティカル"]);

      if (atk !== null) document.getElementById("cAtk").value = atk;
      if (def !== null) document.getElementById("cDef").value = def;
      if (spd !== null) document.getElementById("cSpd").value = spd;
      if (hp !== null) document.getElementById("cHp").value = hp;
      if (sp !== null) document.getElementById("cSp").value = sp;
      if (crt !== null) document.getElementById("cCrt").value = crt;

      const rangeMatch = raw.match(/([^。\n]*?(?:編成されている|味方|自身|属性|種族)[^。\n]*?(?:UP|アップ)?)/);
      if (rangeMatch && rangeMatch[1].trim()) {
        document.getElementById("cRange").value = cleanCell(rangeMatch[1]);
      }

      setStatus("テキストから数値を自動入力しました。内容を確認してください。", "success");
    });

    document.getElementById("addCharaForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser || !isAdminUser(currentUser)) {
        return setStatus("管理者アカウントでログインしてください。", "error");
      }

      const payload = {
        name: cleanCell(document.getElementById("cName").value),
        tribe: cleanCell(document.getElementById("cTribe").value),
        element: cleanCell(document.getElementById("cElement").value),
        range: cleanCell(document.getElementById("cRange").value),
        atk: toNum(document.getElementById("cAtk").value),
        def: toNum(document.getElementById("cDef").value),
        spd: toNum(document.getElementById("cSpd").value),
        hp: toNum(document.getElementById("cHp").value),
        sp: toNum(document.getElementById("cSp").value),
        crt: toNum(document.getElementById("cCrt").value),
        icon: cleanCell(document.getElementById("cIcon").value),
        updatedAt: serverTimestamp()
      };

      setStatus("Firestore に保存中...");
      try {
        await addDoc(collection(db, "characters"), payload);
        setStatus(`「${payload.name}」を Firestore に保存しました！`, "success");
        document.getElementById("addCharaForm").reset();
        document.getElementById("wikiRawInput").value = "";
      } catch (err) {
        setStatus(err.message || "保存に失敗しました。Firestoreのルールを確認してください。", "error");
      }
    });

    // スプレッドシートのA〜K列コピーを一括でFirestoreへ移行
    document.getElementById("bulkImportBtn").addEventListener("click", async () => {
      if (!currentUser || !isAdminUser(currentUser)) {
        return setStatus("管理者アカウントでログインしてください。", "error");
      }

      const raw = document.getElementById("sheetBulkInput").value || "";
      const items = parseSheetRows(raw);
      if (items.length === 0) {
        return setStatus("移行できるデータが見つかりませんでした。A〜K列の行を貼り付けてください。", "error");
      }

      setStatus(`${items.length} 件のデータを Firestore に移行中...`);
      try {
        const chunkSize = 400;
        for (let i = 0; i < items.length; i += chunkSize) {
          const batch = writeBatch(db);
          const slice = items.slice(i, i + chunkSize);
          slice.forEach((item) => {
            const ref = doc(collection(db, "characters"));
            batch.set(ref, item);
          });
          await batch.commit();
        }
        setStatus(`${items.length} 件のキャラデータを Firestore に移行しました！`, "success");
        document.getElementById("sheetBulkInput").value = "";
      } catch (err) {
        setStatus(err.message || "一括移行に失敗しました。", "error");
      }
    });

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        authFormArea.style.display = "none";
        adminArea.style.display = "none";
        loggedInArea.style.display = "block";
        userChip.textContent = user.email || user.displayName || "ログイン中";
        if (isAdminUser(user)) {
          setStatus("管理者アカウントでログイン中です。", "success");
        } else {
          setStatus("ログイン済みです。", "success");
        }
      } else {
        authFormArea.style.display = "block";
        loggedInArea.style.display = "none";
        adminArea.style.display = "none";
      }
    });
  </script>
</body>
</html>
